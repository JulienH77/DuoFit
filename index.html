<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DuoFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="user-selector">
        <button class="user-btn active" data-user="julien">
          <span class="avatar julien">J</span> Julien
        </button>
        <button class="user-btn" data-user="arina">
          <span class="avatar arina">A</span> Arina
        </button>
      </div>
      <div class="header-actions">
        <button class="btn-ghost" id="json-btn">JSON</button>
        <button class="btn-primary" id="add-workout-btn">+ Séance</button>
      </div>
    </header>

    <main class="main-content" id="content"></main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="dashboard">
        <span class="icon">⌂</span>
        <span class="label">Accueil</span>
      </button>
      <button class="nav-item" data-page="calendar">
        <span class="icon">▦</span>
        <span class="label">Calendrier</span>
      </button>
      <button class="nav-item" data-page="exercises">
        <span class="icon">◈</span>
        <span class="label">Exercices</span>
      </button>
      <button class="nav-item" data-page="challenges">
        <span class="icon">◇</span>
        <span class="label">Défis</span>
      </button>
      <button class="nav-item" data-page="profile">
        <span class="icon">◎</span>
        <span class="label">Profil</span>
      </button>
    </nav>
  </div>

  <div class="modal-backdrop" id="modal">
    <div class="modal" id="modal-content"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
